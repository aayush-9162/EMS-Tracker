[workspace]
resolver = "2"
members = ["crates/proto", "crates/server", "crates/agent", "crates/loadtest"]

[workspace.package]
version = "1.5.2"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
ems-proto = { path = "crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", default-features = false }
getrandom = "0.3"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
