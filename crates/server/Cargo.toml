[package]
name = "ems-server"
description = "EMS backend: agent gateway, storage and admin console in one binary."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ems-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
getrandom.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tower-http = { version = "0.7", features = ["compression-gzip"] }
rusqlite = { version = "0.42", features = ["bundled"] }
argon2 = "0.5"
sha2.workspace = true
